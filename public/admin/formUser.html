<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crear Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/admin/Styles.css" />
    <link rel="stylesheet" href="/admin/formUser.css" />
</head>
<body class="bg-section">
    <!-- Navbar -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark p-0" style="margin:0;">
            <div class="container-fluid px-4">
                <a class="navbar-brand" href="/cliente/index.html">MiRestaurante</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContenido" 
                    aria-controls="navbarContenido" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarContenido">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link" href="/admin/Admin.html">Panel Admin</a></li>
                        <li class="nav-item"><a class="nav-link active" href="/admin/formUser.html">Crear Usuario</a></li>
                    </ul>
                    <a href="/cliente/index.html" class="btn btn-outline-light">Ver Sitio Público</a>
                </div>
            </div>
        </nav>

        <div class="container d-flex justify-content-center align-items-center min-vh-80 mt-4">
        <div class="card shadow p-4" style="min-width:340px; max-width:420px; width:100%;">
            <h2 class="mb-4 text-center">Crear nuevo usuario</h2>
            <form id="userForm" autocomplete="off">
                <div class="mb-3">
                    <label for="name" class="form-label">Nombre</label>
                    <input id="name" name="name" class="form-control" required placeholder="Juan Pérez" />
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input id="email" type="email" name="email" class="form-control" required placeholder="correo@dominio.com" />
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input id="password" type="password" name="password" class="form-control" required minlength="6" />
                    <div class="form-text">Mínimo 6 caracteres.</div>
                </div>
                <div class="mb-3">
                    <label for="roleSelect" class="form-label">Rol</label>
                    <select name="role" id="roleSelect" class="form-select" required>
                        <option value="" disabled selected>Selecciona un rol</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary w-100">Crear Usuario</button>
                <div id="msg" class="msg mt-3" role="status" aria-live="polite"></div>
            </form>
        </div>
    </div>

    <script src="/admin/formUser.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

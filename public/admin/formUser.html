<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crear Usuario</title>
    <link rel="stylesheet" href="/admin/Styles.css" />
    <style>
        body { font-family: system-ui, Arial, sans-serif; margin: 2rem; background:#f7f7f7; }
        h1 { margin-bottom: 1rem; font-size: 1.6rem; }
        form { max-width: 420px; background:#fff; padding:1.25rem 1.5rem; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,.08); }
        label { display:block; font-weight:600; margin-top:.85rem; }
        input, select { width:100%; padding:.55rem .65rem; margin-top:.35rem; border:1px solid #ccc; border-radius:4px; font-size:.95rem; }
        button { margin-top:1.2rem; width:100%; padding:.7rem .9rem; background:#0d6efd; border:none; color:#fff; font-size:1rem; font-weight:600; border-radius:6px; cursor:pointer; }
        button:disabled { opacity:.6; cursor:not-allowed; }
        .msg { margin-top:1rem; font-size:.9rem; }
        .msg.ok { color: #137c36; }
        .msg.err { color: #b21e1e; }
        nav { margin-bottom:1.5rem; }
        nav a { text-decoration:none; margin-right:.75rem; color:#0d6efd; font-weight:500; }
        .small { font-size:.75rem; color:#666; margin-top:.15rem; }
    </style>
</head>
<body>
    <nav>
        <a href="/admin/Admin.html">Inicio Admin</a>
        <a href="/admin/formUser.html" aria-current="page">Crear Usuario</a>
        <a href="/client/">Ver Sitio Público</a>
    </nav>
    <h1>Crear nuevo usuario</h1>
    <form id="userForm" autocomplete="off">
        <label>Nombre
            <input name="name" required placeholder="Juan Pérez" />
        </label>
        <label>Email
            <input type="email" name="email" required placeholder="correo@dominio.com" />
        </label>
        <label>Contraseña
            <input type="password" name="password" required minlength="6" />
            <div class="small">Mínimo 6 caracteres.</div>
        </label>
        <label>Rol
            <select name="role" id="roleSelect" required>
                <option value="" disabled selected>Selecciona un rol</option>
            </select>
        </label>
        <button type="submit">Crear Usuario</button>
        <div id="msg" class="msg" role="status" aria-live="polite"></div>
    </form>

    <script>
        // Evitar volver a Admin.html con el botón atrás (neutraliza historial reciente)
        (function preventBackToAdmin(){
            // Reemplaza la entrada previa para que 'Atrás' no regrese a Admin.html
            try { history.replaceState(null, document.title, location.href); } catch {}
            // Si el usuario presiona atrás, reinyectar el estado actual (permite salir con enlaces explícitos)
            window.addEventListener('popstate', function(){
                try { history.pushState(null, document.title, location.href); } catch {}
            });
        })();

        async function fetchRoles() {
            const r = await fetch('/roles', { credentials: 'include'});
            if(!r.ok) throw new Error('No se pudieron cargar roles');
            return r.json();
        }

        async function createUser(payload) {
            const r = await fetch('/users', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify(payload)
            });
            const data = await r.json().catch(()=>({}));
            if(!r.ok) throw new Error(data.error || data.message || 'Error creando usuario');
            return data;
        }

        (async function init(){
            const form = document.getElementById('userForm');
            const msg = document.getElementById('msg');
            const roleSelect = document.getElementById('roleSelect');

            // Cargar roles
            try {
                const roles = await fetchRoles();
                roles.forEach(role => {
                    const opt = document.createElement('option');
                    opt.value = role; opt.textContent = role;
                    roleSelect.appendChild(opt);
                });
            } catch(err) {
                msg.textContent = err.message;
                msg.className = 'msg err';
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                msg.textContent = ''; msg.className='msg';
                const fd = new FormData(form);
                const payload = Object.fromEntries(fd.entries());
                const btn = form.querySelector('button');
                btn.disabled = true; btn.textContent='Creando...';
                try {
                    const res = await createUser(payload);
                    msg.textContent = 'Usuario creado: ' + (res.user?.email || payload.email);
                    msg.className = 'msg ok';
                    form.reset();
                    roleSelect.selectedIndex = 0;
                } catch(err) {
                    msg.textContent = err.message;
                    msg.className = 'msg err';
                } finally {
                    btn.disabled = false; btn.textContent='Crear Usuario';
                }
            });
        })();
    </script>
</body>
</html>

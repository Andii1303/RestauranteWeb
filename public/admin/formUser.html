<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crear Usuario</title>
    <link rel="stylesheet" href="/admin/Styles.css" />
    <link rel="stylesheet" href="/admin/formUser.css" />
</head>
<body>
    <nav>
        <a href="/admin/Admin.html">Inicio Admin</a>
        <a href="/admin/formUser.html" aria-current="page">Crear Usuario</a>
        <a href="/client/">Ver Sitio Público</a>
    </nav>
    <h1>Crear nuevo usuario</h1>
    <form id="userForm" autocomplete="off">
        <label>Nombre
            <input name="name" required placeholder="Juan Pérez" />
        </label>
        <label>Email
            <input type="email" name="email" required placeholder="correo@dominio.com" />
        </label>
        <label>Contraseña
            <input type="password" name="password" required minlength="6" />
            <div class="small">Mínimo 6 caracteres.</div>
        </label>
        <label>Rol
            <select name="role" id="roleSelect" required>
                <option value="" disabled selected>Selecciona un rol</option>
            </select>
        </label>
        <button type="submit">Crear Usuario</button>
        <div id="msg" class="msg" role="status" aria-live="polite"></div>
    </form>

    <script src="/admin/formUser.js"></script>
</body>
</html>

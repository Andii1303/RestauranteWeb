<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel del Cocinero</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="/cliente/Styles.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
  <a class="navbar-brand" href="/cliente/index.html">MiRestaurante</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContenido" aria-controls="navbarContenido" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarContenido">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" href="/cliente/index.html">Inicio</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="Admin.html">Administrador</a>
        </li>
      </ul>

      <!-- Contenedor flexible para búsqueda y botones -->
      <div class="d-flex flex-wrap align-items-center gap-2">
        <!-- Barra de búsqueda -->
        <form class="d-flex" role="search">
          <input class="form-control me-2" type="search" placeholder="Buscar..." aria-label="Buscar">
          <button class="btn btn-outline-light" type="submit">Buscar</button>
        </form>

      <!-- Botón de Cerrar Sesión -->
      <button class="btn btn-outline-danger" id="btnCerrarSesion">Cerrar sesión</button>
    </div>
  </div>
</nav>

  <!-- Contenido principal -->
  <div class="container mt-4">
    <h2 class="mb-4">Órdenes en Cocina</h2>
    <div id="lista-ordenes" class="row g-4">
      <!-- Las órdenes se insertan dinámicamente aquí -->
    </div>

    <hr class="my-5" />
    <h2 class="mb-3">Reservas del día</h2>
    <div class="row g-3 align-items-end mb-3">
      <div class="col-auto">
        <label for="res-fecha" class="form-label">Fecha</label>
        <input type="date" id="res-fecha" class="form-control" />
      </div>
      <div class="col-auto">
        <button id="res-buscar" class="btn btn-primary">Buscar</button>
      </div>
    </div>
    <div id="lista-reservas" class="row g-4">
      <!-- Reservas renderizadas aquí -->
    </div>
  </div>

  <script src="index.js"></script>
</body>
<footer class="bg-dark text-white pt-4 pb-2 mt-5">
  <div class="container">
    <div class="row">
      <div class="col-md-6 mb-3">
        <h5>Mirestaurante</h5>
        <p>© 2025 Mirestaurante. Todos los derechos reservados.</p>
      </div>
      <div class="col-md-3 mb-3 text-center text-md-start">
        <h6>Conocenos</h6>
        <ul class="list-unstyled">
          <li><a href="/cliente/infoRestaurante.html" class="text-white text-decoration-none">¿Quiénes somos?</a></li>
        </ul>
      </div>
      <div class="col-md-3 mb-3 text-center text-md-end">
        <h6>Contactanos</h6>
        <p class="mb-0">Teléfono: +502 5006 0919</p>
        <p class="mb-0">Email: mesafacil@gmail.com</p>
      </div>
    </div>
  </div>
</footer>
</html>

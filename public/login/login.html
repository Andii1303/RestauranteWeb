 <!-- formulario-->
  <div class="login-box">
    <h2>Iniciar Sesión</h2>
    <form id="loginForm">
      <div class="mb-3">
        <label for="email" class="form-label">Correo electrónico</label>
        <input type="email" class="form-control" id="email" placeholder="ejemplo@correo.com" autocomplete="username">
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary w-100">Ingresar</button>
      <div class="mt-3 text-center">
      <br>
  <div id="loginError" class="mt-3 text-center text-danger d-none"></div>
</div>
    </form>
  </div>
 <!-- Fin formulario-->

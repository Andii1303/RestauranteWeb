<!DOCTYPE html>
<!--
  Pantalla de Login
  - Formulario de acceso; envía credenciales a /auth/login.
  - Redirige según rol usando login.js.
-->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inicio de Sesión</title>
  <!-- Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- IMPORTANTE: estos archivos están en la MISMA carpeta /public/login, por eso se referencian directo -->
  <link rel="stylesheet" href="login.css">
  <link rel="stylesheet" href="/public/cliente/Styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>
<body>
  
 <!--navBar-->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm py-3">
  <div class="container-fluid">
    <!-- Marca -->
    <a class="navbar-brand d-flex align-items-center" href="/cliente/index.html">
      <i class="bi bi-shop-window fs-4 me-2"></i>
      <span class="fw-bold">MiRestaurante</span>
    </a>

    <!-- Botón hamburguesa -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContenido"
      aria-controls="navbarContenido" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Contenido colapsable -->
    <div class="collapse navbar-collapse" id="navbarContenido">
      <!-- Navegación principal -->
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" href="/cliente/index.html">
            <i class="bi bi-house-door-fill me-1"></i> Inicio
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/cliente/menu.html">
            <i class="bi bi-list-ul me-1"></i> Comidas
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/reserve/reserve.html">
            <i class="bi bi-calendar-check me-1"></i> Reservas
          </a>
        </li>
      </ul>

      <!-- Carrito de compras -->
      <ul class="navbar-nav me-3">
        <li class="nav-item">
          <a class="nav-link position-relative" href="/cliente/carrito.html">
            <i class="bi bi-cart-fill me-1"></i> Carrito
            <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
              0
            </span>
          </a>
        </li>
      </ul>

      <!-- Búsqueda y botón de inicio -->
      <div class="d-flex flex-wrap align-items-center gap-3">
        <!-- Botón de inicio de sesión -->
        <a href="/login/login.html" class="btn btn-outline-light rounded-pill">
          <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar
        </a>
      </div>
    </div>
  </div>
</nav>

<!-- Contenedor principal -->
<div class="container d-flex justify-content-center align-items-center min-vh-100">
  <div class="col-12 col-sm-8 col-md-6 col-lg-4">
    <div class="card shadow-sm p-4">
      <h2 class="text-center mb-4">Iniciar Sesión</h2>
      <form id="loginForm">
        <div class="mb-3">
          <label for="email" class="form-label">Correo electrónico</label>
          <input type="email" class="form-control" id="email" placeholder="ejemplo@correo.com" autocomplete="username">
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="password" placeholder="••••••••" autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary w-100">Ingresar</button>
        <div id="loginError" class="mt-3 text-center text-danger d-none"></div>
      </form>
    </div>
  </div>
</div>

<footer class="footer-modern text-white mt-auto">
  <div class="container py-4">
    <div class="row align-items-center">

      <!-- Marca e información -->
      <div class="col-md-4 text-center text-md-start mb-3 mb-md-0">
        <h5 class="fw-bold">MiRestaurante</h5>
        <p class="small mb-0">© 2025 MiRestaurante. Todos los derechos reservados.</p>
      </div>

      <!-- Enlaces rápidos -->
      <div class="col-md-4 text-center mb-3 mb-md-0">
        <h6 class="fw-semibold">Conocenos</h6>
        <ul class="list-inline mb-0">
          <li class="list-inline-item"><a href="/cliente/infoRestaurante.html" class="footer-link">¿Quiénes somos?</a></li>
        </ul>
      </div>

      <!-- Redes sociales -->
      <div class="col-md-4 text-center text-md-end">
        <h6 class="fw-semibold">Contactanos</h6>
        <p>Teléfono: +502 5006 0919</p>
        <p>Email: mesafacil@gmail.com</p>
      </div>

    </div>
  </div>
</footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- El JS también está en la misma carpeta /public/login -->
  <script src="login.js"></script>

</body>
</html>

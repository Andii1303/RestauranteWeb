<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservacion</title>
    <link rel="stylesheet" href="/reserve/style.css">
</head>
<body>
        <h1>Reservaciones</h1>
        <h2>Mesas para reservar</h2>

        <!-- Filtro de fecha y horas (intervalos de 30 minutos) -->
        <div class="container" style="max-width:980px;margin:0 auto 16px auto;">
            <div class="card" style="padding:12px;">
                <div class="row" style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;">
                    <div class="col">
                        <label for="reserva-fecha">Fecha</label>
                        <input id="reserva-fecha" type="date" class="form-control" style="min-width:200px;">
                    </div>
                    <div class="col">
                        <label for="reserva-inicio">Check-in</label>
                        <select id="reserva-inicio" class="form-select" style="min-width:180px;"></select>
                    </div>
                    <div class="col">
                        <label for="reserva-fin">Check-out</label>
                        <select id="reserva-fin" class="form-select" style="min-width:180px;"></select>
                    </div>
                </div>
                <small class="text-muted">Los horarios se muestran en intervalos de 30 minutos. Seleccione la fecha y el rango de la reserva.</small>
            </div>
        </div>

    <div class="plano-container">
        <img src="/Imajenes/reserveImg/planoRestaurante.png" alt="Plano del Restaurante" class="plano-img">
        <!-- Mesas (duplicadas con posiciones simples) -->
        <img src="/Imajenes/reserveImg/MesaPara4.png" class="mesa-img" data-mesa-id="MESA_4_A" alt="Mesa 4 A" style="top:38%;left:28%;width:110px;">
        <img src="/Imajenes/reserveImg/MesaPara4.png" class="mesa-img" data-mesa-id="MESA_4_B" alt="Mesa 4 B" style="top:38%;left:58%;width:110px;">
        <img src="/Imajenes/reserveImg/MesaPara4.png" class="mesa-img" data-mesa-id="MESA_4_C" alt="Mesa 4 C" style="top:65%;left:35%;width:110px;">
        <img src="/Imajenes/reserveImg/MesaPara4.png" class="mesa-img" data-mesa-id="MESA_4_D" alt="Mesa 4 D" style="top:65%;left:65%;width:110px;">
    </div>

                <script src="/reserve/reserve.js"></script>
</body>
</html>

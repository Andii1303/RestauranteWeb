<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagar - MiRestaurante</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/cliente/Styles.css">
  <link rel="stylesheet" href="/payments/payments.css">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm py-3 fixed-top" id="mainNavbar">
    <div class="container-fluid">
      <a class="navbar-brand" href="/cliente/index.html">MiRestaurante</a>
    </div>
  </nav>

  <div class="container py-5 payments-container">
    <div class="row">
      <div class="col-md-7">
        <div class="card shadow-sm">
          <div class="card-body">
            <h3 class="mb-3">Datos del cliente</h3>
            <form id="payment-form">
              <div class="mb-3">
                <label class="form-label">Nombre completo</label>
                <input id="cliente-nombre" class="form-control" required>
              </div>
              <div class="mb-3">
                <label class="form-label">DNI / Identificación</label>
                <input id="cliente-dni" class="form-control" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Teléfono</label>
                <input id="cliente-telefono" class="form-control" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Correo electrónico</label>
                <input id="cliente-email" type="email" class="form-control">
              </div>

              <h5 class="mt-4">Método de pago</h5>
              <div class="mb-3">
                <select id="metodo-pago" class="form-select">
                  <option value="tarjeta">Tarjeta de crédito / débito</option>
                  <option value="efectivo">Efectivo</option>
                </select>
              </div>

              <div id="card-details" class="card-details d-block">
                <div class="mb-3">
                  <label class="form-label">Número de tarjeta</label>
                  <input id="card-number" class="form-control" placeholder="4242 4242 4242 4242">
                </div>
                <div class="row g-2">
                  <div class="col-6">
                    <label class="form-label">Vencimiento (MM/AA)</label>
                    <input id="card-exp" class="form-control" placeholder="12/29">
                  </div>
                  <div class="col-6">
                    <label class="form-label">CVC</label>
                    <input id="card-cvc" class="form-control" placeholder="123">
                  </div>
                </div>
              </div>

              <div class="d-grid gap-2 mt-4">
                <button id="submit-payment" class="btn btn-success btn-lg">Pagar ahora</button>
                <a href="/cliente/carrito.html" class="btn btn-outline-secondary">Volver al carrito</a>
              </div>
            </form>
          </div>
        </div>
      </div>

      <div class="col-md-5">
        <div class="card shadow-sm">
          <div class="card-body">
            <h4>Resumen de la orden</h4>
            <div id="order-summary" class="mt-3"></div>
            <hr>
            <h5>Total: <span id="order-total">Q0.00</span></h5>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/payments/payments.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Carrito de Compras</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./Styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">

<!--navBar-->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm py-3">
  <div class="container-fluid">
    <!-- Marca -->
    <a class="navbar-brand d-flex align-items-center" href="/cliente/index.html">
      <i class="bi bi-shop-window fs-4 me-2"></i>
      <span class="fw-bold">MiRestaurante</span>
    </a>

    <!-- Botón hamburguesa -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContenido"
      aria-controls="navbarContenido" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Contenido colapsable -->
    <div class="collapse navbar-collapse" id="navbarContenido">
      <!-- Navegación principal -->
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" href="/cliente/index.html">
            <i class="bi bi-house-door-fill me-1"></i> Inicio
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/cliente/menu.html">
            <i class="bi bi-list-ul me-1"></i> Comidas
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/reserve/reserve.html">
            <i class="bi bi-calendar-check me-1"></i> Reservas
          </a>
        </li>
      </ul>

      <!-- Carrito de compras -->
      <ul class="navbar-nav me-3">
        <li class="nav-item">
          <a class="nav-link position-relative" href="/cliente/carrito.html">
            <i class="bi bi-cart-fill me-1"></i> Carrito
            <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
              0
            </span>
          </a>
        </li>
      </ul>

      <!-- Búsqueda y botón de inicio -->
      <div class="d-flex flex-wrap align-items-center gap-3">
        <!-- Barra de búsqueda con lupa integrada -->
        <form class="position-relative" role="search">
          <input class="form-control rounded-pill ps-5" type="search" placeholder="Buscar" aria-label="Buscar">
          <i class="bi bi-search position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"></i>
        </form>

        <!-- Botón de inicio de sesión -->
        <a href="/login/login.html" class="btn btn-outline-light rounded-pill">
          <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar
        </a>
      </div>
    </div>
  </div>
</nav>

  <!-- Contenido del carrito -->
  <div class="container py-5">
    <h2 class="mb-4 text-center">Tu Carrito</h2>
    <div id="carrito-contenido" class="row g-4"></div>
    
    <template id="tpl-carrito-item">
      <div class="col-md-4">
        <div class="card h-100">
          <div class="card-body text-center">
            <h5 class="card-title" data-el="title"></h5>
            <div class="d-flex justify-content-center align-items-center gap-2 mb-2">
              <button class="btn btn-sm btn-outline-secondary" data-el="decr">-</button>
              <span class="fw-bold" data-el="qty">0</span>
              <button class="btn btn-sm btn-outline-secondary" data-el="incr">+</button>
            </div>
            <div class="text-muted">Q<span data-el="price">0.00</span> c/u</div>
            <div>Subtotal: <strong>Q<span data-el="subtotal">0.00</span></strong></div>
            <button class="btn btn-outline-danger btn-sm" data-el="remove">Quitar</button>
          </div>
        </div>
      </div>
    </template>
    <div class="mt-3 text-end">
      <h5>Total items: <span id="total-items">0</span></h5>
      <h5>Total Q: <span id="total-precio">Q0.00</span></h5>
    </div>

    <div class="text-center mt-4">
      <button id="vaciar-carrito" class="btn btn-danger">Vaciar Carrito</button>
      <button id="pagar-carrito" class="btn btn-success">Pagar</button>
      <button id="continuar-comprando" class="btn btn-secondary">Continuar Comprando</button>
    </div>
  </div>

  <footer class="bg-dark text-white pt-4 pb-2">
    <div class="container">
      <div class="row">
        <div class="col-md-6 mb-3">
          <h5>Mirestaurante</h5>
          <p>© 2025 Mirestaurante. Todos los derechos reservados.</p>
        </div>
        <div class="col-md-3 mb-3">
          <h6>Información</h6>
          <ul class="list-unstyled">
            <li><a href="infoRestaurante.html" class="text-white text-decoration-none">Quiénes somos</a></li>
            <li><a href="infoRestaurante.html" class="text-white text-decoration-none">Visión</a></li>
            <li><a href="infoRestaurante.html" class="text-white text-decoration-none">Misión</a></li>
          </ul>
        </div>
        <div class="col-md-3 mb-3">
          <h6>Síguenos</h6>
          <a href="https://facebook.com" target="_blank" class="text-white me-3"><i class="fab fa-facebook fa-lg"></i></a>
          <a href="https://instagram.com" target="_blank" class="text-white me-3"><i class="fab fa-instagram fa-lg"></i></a>
          <a href="https://tiktok.com" target="_blank" class="text-white"><i class="fab fa-tiktok fa-lg"></i></a>
        </div>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="/cliente/cart-lib.js"></script>
  <script src="/cliente/carrito.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Carrito de Compras</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../cliente/Styles.css">

</head>
<body class="bg-light d-flex d-flex flex-column main-vh-100">

<!--navBar-->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm py-3 fixed-top" id="mainNavbar">
  <div class="container-fluid">
    <!-- Marca -->
    <a class="navbar-brand d-flex align-items-center" href="/cliente/index.html">
      <i class="bi bi-shop-window fs-4 me-2"></i>
      <span class="fw-bold">MiRestaurante</span>
    </a>

    <!-- Botón hamburguesa -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContenido"
      aria-controls="navbarContenido" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Contenido colapsable -->
    <div class="collapse navbar-collapse" id="navbarContenido">
      <!-- Navegación principal -->
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" href="/cliente/index.html">
            <i class="bi bi-house-door-fill me-1"></i> Inicio
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/cliente/menu.html">
            <i class="bi bi-list-ul me-1"></i> Comidas
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/reserve/reserve.html">
            <i class="bi bi-calendar-check me-1"></i> Reservas
          </a>
        </li>
      </ul>

      <!-- Carrito de compras -->
      <ul class="navbar-nav me-3">
        <li class="nav-item">
          <a class="nav-link position-relative" href="/cliente/carrito.html">
            <i class="bi bi-cart-fill me-1"></i> Carrito
            <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
              0
            </span>
          </a>
        </li>
      </ul>

      <!-- Búsqueda y botón de inicio -->
      <div class="d-flex flex-wrap align-items-center gap-3">
        <!-- Botón de inicio de sesión -->
        <a href="/login/login.html" class="btn btn-outline-light rounded-pill">
          <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar
        </a>
      </div>
    </div>
  </div>
</nav>

<main class="flex-grow-1">
  <!-- Contenido del carrito -->
  <div class="container py-5">
    <h2 class="mb-4 text-center">Tu Carrito</h2>
    <div id="carrito-contenido" class="row g-4"></div>
    
    <template id="tpl-carrito-item">
      <div class="col-md-4">
        <div class="card h-100">
          <div class="card-body text-center">
            <h5 class="card-title" data-el="title"></h5>
            <div class="d-flex justify-content-center align-items-center gap-2 mb-2">
              <button class="btn btn-sm btn-outline-secondary" data-el="decr">-</button>
              <span class="fw-bold" data-el="qty">0</span>
              <button class="btn btn-sm btn-outline-secondary" data-el="incr">+</button>
            </div>
            <div class="text-muted">Q<span data-el="price">0.00</span> c/u</div>
            <div>Subtotal: <strong>Q<span data-el="subtotal">0.00</span></strong></div>
            <button class="btn btn-outline-danger btn-sm" data-el="remove">Quitar</button>
          </div>
        </div>
      </div>
    </template>
    <div class="mt-3 text-end">
      <h5>Total items: <span id="total-items">0</span></h5>
      <h5>Total Q: <span id="total-precio">Q0.00</span></h5>
    </div>

    <div class="text-center mt-4">
      <button id="vaciar-carrito" class="btn btn-danger">Vaciar Carrito</button>
      <button id="cancelar-reserva" class="btn btn-outline-warning">Cancelar reserva</button>
      <button id="pagar-carrito" class="btn btn-success">Pagar</button>
      <button id="continuar-comprando" class="btn btn-secondary">Continuar Comprando</button>
    </div>
  </div>
</main>
<br> <br> <br> <br> <br> <br> <br> <br>

        <p class="small mb-0">© 2025 MiRestaurante. Todos los derechos reservados.</p>
      </div>

      <!-- Enlaces rápidos -->
      <div class="col-md-4 text-center mb-3 mb-md-0">
        <h6 class="fw-semibold">Conocenos</h6>
        <ul class="list-inline mb-0">
          <li class="list-inline-item"><a href="/cliente/infoRestaurante.html" class="footer-link">¿Quiénes somos?</a></li>
        </ul>
      </div>

      <!-- Redes sociales -->
      <div class="col-md-4 text-center text-md-end">

        <p>Teléfono: +502 5006 0919</p>
        <p>Email: mesafacil@gmail.com</p>
      </div>

    </div>
  </div>
</footer>

  <!-- Scripts -->

</body>
</html>

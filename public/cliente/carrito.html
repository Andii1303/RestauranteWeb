<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Carrito de Compras</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./Styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">

  <!-- Navbar  -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
  <a class="navbar-brand" href="/cliente/index.html">MiRestaurante</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContenido" aria-controls="navbarContenido" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarContenido">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="/cliente/index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="/cliente/menu.html">Comidas</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Reservas</a></li>
        </ul>

        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" href="carrito.html">
              <i class="fas fa-shopping-cart"></i> Carrito
              <span id="cart-count" class="badge bg-danger">0</span>
            </a>
          </li>
        </ul>

        <div class="d-flex flex-wrap align-items-center gap-2">
          <form class="d-flex" role="search">
            <input class="form-control me-2" type="search" placeholder="Buscar..." aria-label="Buscar">
            <button class="btn btn-outline-light" type="submit">Buscar</button>
          </form>
          <a href="/login/login.html" class="btn btn-outline-light">Iniciar</a>
          <a href="#" class="btn btn-primary">Unirse</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- Contenido del carrito -->
  <div class="container py-5">
    <h2 class="mb-4 text-center">Tu Carrito</h2>
    <div id="carrito-contenido" class="row g-4"></div>
    <div class="mt-3 text-end">
      <h5>Total items: <span id="total-items">0</span></h5>
      <h5>Total Q: <span id="total-precio">Q0.00</span></h5>
    </div>

    <div class="text-center mt-4">
      <button id="vaciar-carrito" class="btn btn-danger">Vaciar Carrito</button>
      <button id="pagar-carrito" class="btn btn-success">Pagar</button>
      <button id="continuar-comprando" class="btn btn-secondary">Continuar Comprando</button>
    </div>
  </div>

  <footer class="bg-dark text-white pt-4 pb-2">
    <div class="container">
      <div class="row">
        <div class="col-md-6 mb-3">
          <h5>Mirestaurante</h5>
          <p>© 2025 Mirestaurante. Todos los derechos reservados.</p>
        </div>
        <div class="col-md-3 mb-3">
          <h6>Información</h6>
          <ul class="list-unstyled">
            <li><a href="/quienes-somos.html" class="text-white text-decoration-none">Quiénes somos</a></li>
            <li><a href="/vision.html" class="text-white text-decoration-none">Visión</a></li>
            <li><a href="/mision.html" class="text-white text-decoration-none">Misión</a></li>
          </ul>
        </div>
        <div class="col-md-3 mb-3">
          <h6>Síguenos</h6>
          <a href="https://facebook.com" target="_blank" class="text-white me-3"><i class="fab fa-facebook fa-lg"></i></a>
          <a href="https://instagram.com" target="_blank" class="text-white me-3"><i class="fab fa-instagram fa-lg"></i></a>
          <a href="https://tiktok.com" target="_blank" class="text-white"><i class="fab fa-tiktok fa-lg"></i></a>
        </div>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const carritoContenido = document.getElementById('carrito-contenido');
      const cartCount = document.getElementById('cart-count');
      const vaciarBtn = document.getElementById('vaciar-carrito');
      const totalItemsEl = document.getElementById('total-items');
      const totalPrecioEl = document.getElementById('total-precio');
      const contComprando = document.getElementById('continuar-comprando');
      const pagarBtn = document.getElementById('pagar-carrito');

      contComprando.addEventListener('click', () => {
        window.location.href = '/cliente/menu.html';
      });

      pagarBtn.addEventListener('click', () => {
        // Ir a la página de pago
        window.location.href = '/cliente/pagar.html';


      });

      function getCart() {
        const raw = localStorage.getItem('carritoV2') || localStorage.getItem('carrito');
        let cart;
        try { cart = raw ? JSON.parse(raw) : null; } catch {}
        if (Array.isArray(cart)) {
          const items = {};
          for (const it of cart) {
            const key = (it.id != null ? String(it.id) : it.nombre);
            if (!items[key]) items[key] = { id: it.id ?? null, nombre: it.nombre, qty: 0, price: it.price ?? 0 };
            items[key].qty += 1;
          }
          cart = { items };
          localStorage.setItem('carritoV2', JSON.stringify(cart));
          localStorage.removeItem('carrito');
        }
        if (!cart || !cart.items) cart = { items: {} };
        return cart;
      }

      function setCart(cart) {
        localStorage.setItem('carritoV2', JSON.stringify(cart));
        cartCount.textContent = totalQty(cart);
        localStorage.setItem('cartCount', String(totalQty(cart)));
      }

      function totalQty(cart) { return Object.values(cart.items).reduce((a, it) => a + (Number(it.qty)||0), 0); }
      function totalPrecio(cart) { return Object.values(cart.items).reduce((a, it) => a + (Number(it.qty||0) * Number(it.price||0)), 0); }

      let carrito = getCart();
      cartCount.textContent = totalQty(carrito);

      function renderCarrito() {
        carritoContenido.innerHTML = '';

        const entries = Object.entries(carrito.items);
        if (entries.length === 0) {
          carritoContenido.innerHTML = '<p class="text-center">Tu carrito está vacío.</p>';
          totalItemsEl.textContent = '0';
          totalPrecioEl.textContent = 'Q0.00';
          return;
        }

        entries.forEach(([key, producto], index) => {
          const card = document.createElement('div');
          card.className = 'col-md-4';
          card.innerHTML = `
            <div class="card h-100">
              <div class="card-body text-center">
                <h5 class="card-title">${producto.nombre}</h5>
                <div class="d-flex justify-content-center align-items-center gap-2 mb-2">
                  <button class="btn btn-sm btn-outline-secondary qty-decr" data-key="${key}">-</button>
                  <span class="fw-bold">${producto.qty}</span>
                  <button class="btn btn-sm btn-outline-secondary qty-incr" data-key="${key}">+</button>
                </div>
                <div class="text-muted">Q${Number(producto.price||0).toFixed(2)} c/u</div>
                <div>Subtotal: <strong>Q${(Number(producto.price||0)*Number(producto.qty||0)).toFixed(2)}</strong></div>
                <button class="btn btn-outline-danger btn-sm eliminar" data-key="${key}">Quitar</button>
              </div>
            </div>
          `;
          carritoContenido.appendChild(card);
        });

        // Listeners para +/- y quitar
        document.querySelectorAll('.qty-incr').forEach(btn => {
          btn.addEventListener('click', () => {
            const key = btn.getAttribute('data-key');
            if (!carrito.items[key]) return;
            carrito.items[key].qty += 1;
            setCart(carrito);
            renderCarrito();
          });
        });
        document.querySelectorAll('.qty-decr').forEach(btn => {
          btn.addEventListener('click', () => {
            const key = btn.getAttribute('data-key');
            if (!carrito.items[key]) return;
            carrito.items[key].qty -= 1;
            if (carrito.items[key].qty <= 0) delete carrito.items[key];
            setCart(carrito);
            renderCarrito();
          });
        });
        document.querySelectorAll('.eliminar').forEach(btn => {
          btn.addEventListener('click', () => {
            const key = btn.getAttribute('data-key');
            delete carrito.items[key];
            setCart(carrito);
            renderCarrito();
          });
        });

        totalItemsEl.textContent = String(totalQty(carrito));
        totalPrecioEl.textContent = 'Q' + totalPrecio(carrito).toFixed(2);
      }

      vaciarBtn.addEventListener('click', () => {
        carrito = { items: {} };
        setCart(carrito);
        renderCarrito();
      });

      renderCarrito();
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagar - MiRestaurante</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./Styles.css">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="/cliente/index.html">MiRestaurante</a>
    </div>
  </nav>

  <div class="container py-5">
    <div class="row">
      <div class="col-md-7">
        <div class="card shadow-sm">
          <div class="card-body">
            <h3 class="mb-3">Datos del cliente</h3>
            <form id="payment-form">
              <div class="mb-3">
                <label class="form-label">Nombre completo</label>
                <input id="cliente-nombre" class="form-control" required>
              </div>
              <div class="mb-3">
                <label class="form-label">DNI / Identificación</label>
                <input id="cliente-dni" class="form-control" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Teléfono</label>
                <input id="cliente-telefono" class="form-control" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Correo electrónico</label>
                <input id="cliente-email" type="email" class="form-control">
              </div>

              <h5 class="mt-4">Método de pago</h5>
              <div class="mb-3">
                <select id="metodo-pago" class="form-select">
                  <option value="tarjeta">Tarjeta de crédito / débito</option>
                  <option value="efectivo">Efectivo</option>
                </select>
              </div>

              <div id="card-details" style="display:block">
                <div class="mb-3">
                  <label class="form-label">Número de tarjeta</label>
                  <input id="card-number" class="form-control" placeholder="4242 4242 4242 4242">
                </div>
                <div class="row g-2">
                  <div class="col-6">
                    <label class="form-label">Vencimiento (MM/AA)</label>
                    <input id="card-exp" class="form-control" placeholder="12/29">
                  </div>
                  <div class="col-6">
                    <label class="form-label">CVC</label>
                    <input id="card-cvc" class="form-control" placeholder="123">
                  </div>
                </div>
              </div>

              <div class="d-grid gap-2 mt-4">
                <button id="submit-payment" class="btn btn-success btn-lg">Pagar ahora</button>
                <a href="/cliente/carrito.html" class="btn btn-outline-secondary">Volver al carrito</a>
              </div>
            </form>
          </div>
        </div>
      </div>

      <div class="col-md-5">
        <div class="card shadow-sm">
          <div class="card-body">
            <h4>Resumen de la orden</h4>
            <div id="order-summary" class="mt-3"></div>
            <hr>
            <h5>Total: <span id="order-total">Q0.00</span></h5>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function fmtQ(v){ return 'Q' + Number(v||0).toFixed(2); }
    function getCart(){ try{ return JSON.parse(localStorage.getItem('carritoV2')||'{}') || {items:{}} }catch{return {items:{}}} }

    function renderSummary(){
      const cart = getCart();
      const container = document.getElementById('order-summary');
      container.innerHTML = '';
      let total = 0; let items = 0;
      for(const k of Object.keys(cart.items||{})){
        const it = cart.items[k];
        const row = document.createElement('div');
        row.className = 'd-flex justify-content-between mb-2';
        row.innerHTML = `<div>${it.nombre} <small class="text-muted">x${it.qty}</small></div><div>${fmtQ(it.qty * it.price)}</div>`;
        container.appendChild(row);
        total += (Number(it.qty||0) * Number(it.price||0)); items += Number(it.qty||0);
      }
      document.getElementById('order-total').textContent = fmtQ(total);
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderSummary();
      const metodo = document.getElementById('metodo-pago');
      metodo.addEventListener('change', () => {
        document.getElementById('card-details').style.display = metodo.value === 'tarjeta' ? 'block' : 'none';
      });

      document.getElementById('submit-payment').addEventListener('click', async (e) => {
        e.preventDefault();
        const name = document.getElementById('cliente-nombre').value.trim();
        if(!name){ alert('Ingrese nombre'); return; }

        // Preparar payload
        const facturaId = localStorage.getItem('facturaId');
        const raw = localStorage.getItem('carritoV2');
        let cart = raw ? JSON.parse(raw) : { items: {} };
        const itemsArr = [];
        // Siempre enviamos items para que el backend reemplace y no quede basura
        for (const k of Object.keys(cart.items||{})){
          const it = cart.items[k];
          itemsArr.push({
            menu_item_id: it.id ?? null,
            nombre: it.nombre,
            cantidad: Number(it.qty||0),
            precio_unit: Number(it.price||0),
            item_type: 'PLATO'
          });
        }

        const payload = {
          factura_id: facturaId ? Number(facturaId) : undefined,
          status: 'PAGADA',
          cliente: {
            nombre: name,
            dni: document.getElementById('cliente-dni').value.trim() || null,
            telefono: document.getElementById('cliente-telefono').value.trim() || null,
            email: document.getElementById('cliente-email').value.trim() || null,
          },
          items: itemsArr
        };

        try {
          const r = await fetch('/api/facturas/checkout', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
          if (!r.ok) throw new Error('Error al procesar el pago (HTTP '+r.status+')');
          // Limpieza
          localStorage.removeItem('carritoV2');
          localStorage.removeItem('cartCount');
          localStorage.removeItem('facturaId');
          localStorage.removeItem('mesasMixId');
          window.location.href = '/cliente/pago-confirmacion.html';
        } catch (err) {
          alert('No se pudo completar el pago: '+ err.message);
        }
      });
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

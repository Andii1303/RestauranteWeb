<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Carrito de Compras</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/Styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">

  <!-- Navbar  -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">MiRestaurante</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContenido" aria-controls="navbarContenido" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarContenido">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="menu.html">Comidas</a></li>
          <li class="nav-item"><a class="nav-link" href="reservas.html">Reservas</a></li>
        </ul>

        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" href="carrito.html">
              <i class="fas fa-shopping-cart"></i> Carrito
              <span id="cart-count" class="badge bg-danger">0</span>
            </a>
          </li>
        </ul>

        <div class="d-flex flex-wrap align-items-center gap-2">
          <form class="d-flex" role="search">
            <input class="form-control me-2" type="search" placeholder="Buscar..." aria-label="Buscar">
            <button class="btn btn-outline-light" type="submit">Buscar</button>
          </form>
          <a href="../iniciar/login.html" class="btn btn-outline-light">Iniciar</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- Contenido del carrito -->
  <div class="container py-5">
    <h2 class="mb-4 text-center">Tu Carrito</h2>
    <div id="carrito-contenido" class="row g-4"></div>

    <div class="text-center mt-4">
      <button id="vaciar-carrito" class="btn btn-danger">Vaciar Carrito</button>
    </div>
  </div>

  <footer class="bg-dark text-white pt-4 pb-2">
    <div class="container">
      <div class="row">
        <div class="col-md-6 mb-3">
          <h5>Mirestaurante</h5>
          <p>© 2025 Mirestaurante. Todos los derechos reservados.</p>
        </div>
        <div class="col-md-3 mb-3">
          <h6>Información</h6>
          <ul class="list-unstyled">
            <li><a href="/quienes-somos.html" class="text-white text-decoration-none">Quiénes somos</a></li>
            <li><a href="/vision.html" class="text-white text-decoration-none">Visión</a></li>
            <li><a href="/mision.html" class="text-white text-decoration-none">Misión</a></li>
          </ul>
        </div>
        <div class="col-md-3 mb-3">
          <h6>Síguenos</h6>
          <a href="https://facebook.com" target="_blank" class="text-white me-3"><i class="fab fa-facebook fa-lg"></i></a>
          <a href="https://instagram.com" target="_blank" class="text-white me-3"><i class="fab fa-instagram fa-lg"></i></a>
          <a href="https://tiktok.com" target="_blank" class="text-white"><i class="fab fa-tiktok fa-lg"></i></a>
        </div>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const carritoContenido = document.getElementById('carrito-contenido');
      const cartCount = document.getElementById('cart-count');
      const vaciarBtn = document.getElementById('vaciar-carrito');

      let carrito = JSON.parse(localStorage.getItem('carrito')) || [];
      cartCount.textContent = carrito.length;

      function renderCarrito() {
        carritoContenido.innerHTML = '';

        if (carrito.length === 0) {
          carritoContenido.innerHTML = '<p class="text-center">Tu carrito está vacío.</p>';
          return;
        }

        carrito.forEach((producto, index) => {
          const card = document.createElement('div');
          card.className = 'col-md-4';
          card.innerHTML = `
            <div class="card h-100">
              <div class="card-body text-center">
                <h5 class="card-title">${producto.nombre}</h5>
                <button class="btn btn-outline-danger btn-sm eliminar" data-index="${index}">Eliminar</button>
              </div>
            </div>
          `;
          carritoContenido.appendChild(card);
        });

        document.querySelectorAll('.eliminar').forEach(btn => {
          btn.addEventListener('click', () => {
            const index = btn.getAttribute('data-index');
            carrito.splice(index, 1);
            localStorage.setItem('carrito', JSON.stringify(carrito));
            cartCount.textContent = carrito.length;
            renderCarrito();
          });
        });
      }

      vaciarBtn.addEventListener('click', () => {
        carrito = [];
        localStorage.removeItem('carrito');
        cartCount.textContent = 0;
        renderCarrito();
      });

      renderCarrito();
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
